<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco2Nature — Animation Plancton</title>
    <meta
      name="description"
      content="Animation vectorielle SVG bioluminescente au format 4:5 (1080x1350) sur le plancton marin de la Manche, pour Eco2Nature en partenariat avec Port de Dieppe."
    />
    <meta property="og:title" content="Eco2Nature — Animation Plancton" />
    <meta
      property="og:description"
      content="Invisibles à l'œil nu, indispensables à la vie de nos océans ! Animation vectorielle du plancton marin en partenariat avec Port de Dieppe."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #030b17;
        color: #f8fafc;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #030b17;
        overflow: hidden;
      }

      .fb-frame-4-5 {
        position: relative;
        aspect-ratio: 4 / 5;
        width: min(96vw, calc(96vh * 0.8));
        height: min(96vh, calc(96vw * 1.25));
        max-width: 1080px;
        max-height: 1350px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(0, 245, 212, 0.2);
        box-shadow: 0 0 80px rgba(0, 187, 249, 0.12);
      }

      .fb-frame-4-5.is-zen {
        width: min(100vw, calc(100vh * 0.8));
        height: min(100vh, calc(100vw * 1.25));
        border: none;
        box-shadow: none;
      }

      .fb-frame-4-5 svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scene-paused svg * {
        animation-play-state: paused !important;
      }

      .controls-bar {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
        border: 1px solid rgba(34, 211, 238, 0.22);
        background: rgba(4, 17, 34, 0.86);
        backdrop-filter: blur(10px);
        opacity: 0.78;
        transition: opacity 180ms ease;
      }

      .controls-bar:hover {
        opacity: 1;
      }

      .controls-bar.hidden {
        display: none;
      }

      .ctrl-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 12px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: #cffafe;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .ctrl-btn:hover {
        background: rgba(6, 182, 212, 0.16);
        color: #ffffff;
      }

      .ctrl-btn:focus-visible,
      .restore-btn:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 2px;
      }

      .ctrl-btn-accent {
        background: rgba(0, 245, 212, 0.15);
        color: #00f5d4;
      }

      .ctrl-btn-accent:hover {
        background: rgba(0, 245, 212, 0.26);
        color: #00f5d4;
      }

      .restore-btn {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        border: 1px solid rgba(34, 211, 238, 0.3);
        background: rgba(4, 17, 34, 0.82);
        color: #a5f3fc;
        cursor: pointer;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .restore-btn.visible {
        display: inline-flex;
      }

      .restore-btn:hover,
      .restore-btn:focus-visible {
        opacity: 0.75;
      }

      /* ============================================================
         SVG 60fps GPU-Composited Animations
      ============================================================ */
      .font-display {
        font-family: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", "Montserrat", system-ui, -apple-system, sans-serif;
      }
      .origin-center {
        transform-box: fill-box;
        transform-origin: center;
      }
      .origin-left {
        transform-box: fill-box;
        transform-origin: left center;
      }
      .origin-bottom {
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      @keyframes floatChainA {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        25% { transform: translate3d(14px, -9px, 0) rotate(1.8deg); }
        50% { transform: translate3d(22px, 5px, 0) rotate(-1.2deg); }
        75% { transform: translate3d(6px, 11px, 0) rotate(1deg); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverseSlow {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes starDrift {
        0%, 100% { transform: translate3d(0px, 0px, 0); }
        50% { transform: translate3d(-16px, 14px, 0); }
      }
      @keyframes copepodSwimHero {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        20% { transform: translate3d(18px, -14px, 0) rotate(-4deg); }
        45% { transform: translate3d(34px, -6px, 0) rotate(2deg); }
        70% { transform: translate3d(12px, 14px, 0) rotate(5deg); }
      }
      @keyframes copepodSwimSmall {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        33% { transform: translate3d(-16px, -18px, 0) rotate(6deg); }
        66% { transform: translate3d(14px, -8px, 0) rotate(-4deg); }
      }
      @keyframes antennaWaveTop {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-7deg); }
      }
      @keyframes antennaWaveBottom {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(7deg); }
      }
      @keyframes ceratiumGlide {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        50% { transform: translate3d(-18px, -22px, 0) rotate(-6deg); }
      }
      @keyframes noctilucaPulse {
        0%, 100% { transform: translate3d(0px, 0px, 0) scale(1); opacity: 0.92; }
        50% { transform: translate3d(10px, -14px, 0) scale(1.06); opacity: 1; }
      }
      @keyframes larvaSwim {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        30% { transform: translate3d(-20px, 8px, 0) rotate(-5deg); }
        65% { transform: translate3d(12px, 16px, 0) rotate(4deg); }
      }
      @keyframes veligerDrift {
        0%, 100% { transform: translate3d(0px, 0px, 0) rotate(0deg); }
        50% { transform: translate3d(20px, -12px, 0) rotate(5deg); }
      }
      @keyframes flagellaWiggle {
        0%, 100% { transform: scaleY(1) skewX(0deg); }
        50% { transform: scaleY(0.88) skewX(8deg); }
      }
      @keyframes sporeRise {
        0% { transform: translate3d(0px, 28px, 0) scale(0.7); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.85; }
        100% { transform: translate3d(10px, -48px, 0) scale(1.1); opacity: 0; }
      }
      @keyframes beamPulse {
        0%, 100% { opacity: 0.62; }
        50% { opacity: 0.86; }
      }
      @keyframes beamParticleRise {
        0% { transform: translate3d(0px, 0px, 0) scale(0.6); opacity: 0; }
        15% { opacity: 0.95; }
        85% { opacity: 0.75; }
        100% { transform: translate3d(0px, -225px, 0) scale(1.25); opacity: 0; }
      }
      @keyframes dropletGlow {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes pipetteDrop {
        0%, 100% { transform: translate3d(0px, 0px, 0) scale(0.96); opacity: 0.85; }
        50% { transform: translate3d(0px, 4px, 0) scale(1.08); opacity: 1; }
      }
      @keyframes meniscusWave {
        0%, 100% { transform: translate3d(-4px, 0px, 0); }
        50% { transform: translate3d(4px, 1.5px, 0); }
      }
      @keyframes bottleBubble {
        0% { transform: translate3d(0px, 0px, 0); opacity: 0; }
        20% { opacity: 0.85; }
        85% { opacity: 0.8; }
        100% { transform: translate3d(3px, -95px, 0); opacity: 0; }
      }
      @keyframes bgFloatSlow {
        0%, 100% { transform: translate3d(0px, 0px, 0); opacity: 0.25; }
        50% { transform: translate3d(8px, -16px, 0); opacity: 0.65; }
      }

      .anim-chain-a { animation: floatChainA 11s ease-in-out infinite; will-change: transform; }
      .anim-star-drift { animation: starDrift 14s ease-in-out infinite; will-change: transform; }
      .anim-spin-slow { animation: spinSlow 28s linear infinite; will-change: transform; }
      .anim-spin-rev { animation: spinReverseSlow 42s linear infinite; will-change: transform; }
      .anim-copepod-hero { animation: copepodSwimHero 9s ease-in-out infinite; will-change: transform; }
      .anim-copepod-small { animation: copepodSwimSmall 10.5s ease-in-out infinite; will-change: transform; }
      .anim-ant-top { animation: antennaWaveTop 2.6s ease-in-out infinite; will-change: transform; }
      .anim-ant-bot { animation: antennaWaveBottom 2.6s ease-in-out infinite; will-change: transform; }
      .anim-ceratium { animation: ceratiumGlide 12s ease-in-out infinite; will-change: transform; }
      .anim-noctiluca { animation: noctilucaPulse 7.5s ease-in-out infinite; will-change: transform, opacity; }
      .anim-larva { animation: larvaSwim 10s ease-in-out infinite; will-change: transform; }
      .anim-veliger { animation: veligerDrift 11.5s ease-in-out infinite; will-change: transform; }
      .anim-flagella { animation: flagellaWiggle 1.8s ease-in-out infinite; will-change: transform; }
      .anim-beam { animation: beamPulse 4.5s ease-in-out infinite; will-change: opacity; }
      .anim-droplet { animation: dropletGlow 3s ease-in-out infinite; will-change: transform, opacity; }
      .anim-pipette-drop { animation: pipetteDrop 3.4s ease-in-out infinite; will-change: transform, opacity; }
      .anim-meniscus { animation: meniscusWave 4.2s ease-in-out infinite; will-change: transform; }

      .p-bg-1 { animation: bgFloatSlow 8s ease-in-out infinite; }
      .p-bg-2 { animation: bgFloatSlow 9.5s ease-in-out 1s infinite; }
      .p-bg-3 { animation: bgFloatSlow 7s ease-in-out 2s infinite; }
      .p-bg-4 { animation: bgFloatSlow 11s ease-in-out 0.5s infinite; }
      .p-bg-5 { animation: bgFloatSlow 10s ease-in-out 1.8s infinite; }
      .p-bg-6 { animation: bgFloatSlow 8.5s ease-in-out 2.5s infinite; }
      .p-bg-7 { animation: bgFloatSlow 9s ease-in-out 1.2s infinite; }
      .p-bg-8 { animation: bgFloatSlow 7.8s ease-in-out 0.8s infinite; }

      .p-beam-1 { animation: beamParticleRise 3.2s linear infinite; }
      .p-beam-2 { animation: beamParticleRise 4.1s linear 0.7s infinite; }
      .p-beam-3 { animation: beamParticleRise 3.6s linear 1.5s infinite; }
      .p-beam-4 { animation: beamParticleRise 2.9s linear 2.1s infinite; }
      .p-beam-5 { animation: beamParticleRise 4.5s linear 2.8s infinite; }
      .p-beam-6 { animation: beamParticleRise 3.8s linear 0.3s infinite; }

      .p-spore-1 { animation: sporeRise 5.8s ease-in-out infinite; }
      .p-spore-2 { animation: sporeRise 6.6s ease-in-out 1.1s infinite; }
      .p-spore-3 { animation: sporeRise 5.2s ease-in-out 2.2s infinite; }
      .p-spore-4 { animation: sporeRise 6.1s ease-in-out 0.6s infinite; }
      .p-spore-5 { animation: sporeRise 7s ease-in-out 3.1s infinite; }
      .p-spore-6 { animation: sporeRise 5.5s ease-in-out 1.8s infinite; }
      .p-spore-7 { animation: sporeRise 6.4s ease-in-out 2.7s infinite; }
      .p-spore-8 { animation: sporeRise 5.9s ease-in-out 0.4s infinite; }

      .p-bottle-1 { animation: bottleBubble 4s linear infinite; }
      .p-bottle-2 { animation: bottleBubble 3.4s linear 1.2s infinite; }
      .p-bottle-3 { animation: bottleBubble 4.6s linear 2.1s infinite; }
      .p-bottle-4 { animation: bottleBubble 3.8s linear 0.6s infinite; }

      @media (prefers-reduced-motion: reduce) {
        svg * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" class="stage">
      <!-- Strict 4:5 (1080x1350) Centered Facebook Publication Container -->
      <main id="fb-frame" class="fb-frame-4-5">
        <svg
          id="eco2nature-plancton-svg"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 1080 1350"
          width="100%"
          height="100%"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="Animation Plancton — Eco2Nature en partenariat avec Port de Dieppe"
          style="display: block; background: #030B17;"
        >
          <defs>
            <!-- Crisp Text Glow Filters -->
            <filter id="text-glow-white" x="-25%" y="-40%" width="150%" height="180%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#01060E" flood-opacity="0.95" />
              <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="softAlpha" />
              <feFlood flood-color="#E0FAFF" flood-opacity="0.32" result="flood" />
              <feComposite in="flood" in2="softAlpha" operator="in" result="glow" />
              <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="text-glow-cyan" x="-25%" y="-40%" width="150%" height="180%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#01060E" flood-opacity="0.98" />
              <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="softAlpha" />
              <feFlood flood-color="#00F5D4" flood-opacity="0.45" result="flood" />
              <feComposite in="flood" in2="softAlpha" operator="in" result="glow" />
              <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="text-glow-green" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#01060E" flood-opacity="0.95" />
              <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="softAlpha" />
              <feFlood flood-color="#39FF14" flood-opacity="0.5" result="flood" />
              <feComposite in="flood" in2="softAlpha" operator="in" result="glow" />
              <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="text-glow-yellow" x="-25%" y="-40%" width="150%" height="180%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#01060E" flood-opacity="0.98" />
              <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="softAlpha" />
              <feFlood flood-color="#FEE440" flood-opacity="0.36" result="flood" />
              <feComposite in="flood" in2="softAlpha" operator="in" result="glow" />
              <feMerge>
                <feMergeNode in="glow" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <!-- Bioluminescent Glow Filters -->
            <filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="6" result="blur1" />
              <feGaussianBlur stdDeviation="14" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="glow-green" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="5" result="blur1" />
              <feGaussianBlur stdDeviation="12" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="glow-magenta" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="5.5" result="blur1" />
              <feGaussianBlur stdDeviation="13" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="glow-yellow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="5" result="blur1" />
              <feGaussianBlur stdDeviation="11" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <filter id="glow-ring" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="10" result="blurOuter" />
              <feGaussianBlur stdDeviation="3.5" result="blurInner" />
              <feMerge>
                <feMergeNode in="blurOuter" />
                <feMergeNode in="blurInner" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

            <!-- Gradients -->
            <radialGradient id="bg-abyss" cx="50%" cy="44%" r="65%">
              <stop offset="0%" stop-color="#072240" stop-opacity="0.85" />
              <stop offset="48%" stop-color="#041226" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#030B17" stop-opacity="1" />
            </radialGradient>

            <radialGradient id="lens-water" cx="50%" cy="46%" r="54%">
              <stop offset="0%" stop-color="#063156" />
              <stop offset="55%" stop-color="#041B34" />
              <stop offset="100%" stop-color="#020B18" />
            </radialGradient>

            <linearGradient id="brand-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
              <stop offset="25%" stop-color="#39FF14" stop-opacity="0.9" />
              <stop offset="50%" stop-color="#00F5D4" stop-opacity="1" />
              <stop offset="75%" stop-color="#00BBF9" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#00BBF9" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.72" />
              <stop offset="30%" stop-color="#00BBF9" stop-opacity="0.36" />
              <stop offset="75%" stop-color="#00F5D4" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.02" />
            </linearGradient>

            <linearGradient id="beam-core-grad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
              <stop offset="28%" stop-color="#00F5D4" stop-opacity="0.38" />
              <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="copepod-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF007F" />
              <stop offset="55%" stop-color="#FF4D4D" />
              <stop offset="100%" stop-color="#FF9E00" />
            </linearGradient>

            <radialGradient id="noctiluca-grad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#FFF7AE" stop-opacity="0.95" />
              <stop offset="45%" stop-color="#FEE440" stop-opacity="0.75" />
              <stop offset="100%" stop-color="#FF9E00" stop-opacity="0.18" />
            </radialGradient>

            <linearGradient id="bench-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00BBF9" stop-opacity="0" />
              <stop offset="18%" stop-color="#00BBF9" stop-opacity="0.85" />
              <stop offset="50%" stop-color="#00F5D4" stop-opacity="1" />
              <stop offset="82%" stop-color="#00BBF9" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#00BBF9" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="bench-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00BBF9" stop-opacity="0.18" />
              <stop offset="45%" stop-color="#041930" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#030B17" stop-opacity="0" />
            </linearGradient>

            <linearGradient id="bottle-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.82" />
              <stop offset="45%" stop-color="#00BBF9" stop-opacity="0.68" />
              <stop offset="100%" stop-color="#0077B6" stop-opacity="0.88" />
            </linearGradient>

            <linearGradient id="net-mesh-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00BBF9" stop-opacity="0.16" />
              <stop offset="70%" stop-color="#00F5D4" stop-opacity="0.24" />
              <stop offset="100%" stop-color="#39FF14" stop-opacity="0.34" />
            </linearGradient>

            <linearGradient id="microscope-body" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0B223D" />
              <stop offset="60%" stop-color="#061426" />
              <stop offset="100%" stop-color="#040D1A" />
            </linearGradient>

            <pattern id="plankton-net-mesh" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
              <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#00F5D4" stroke-width="0.7" stroke-opacity="0.52" />
            </pattern>

            <clipPath id="lens-clip">
              <circle cx="540" cy="582" r="222" />
            </clipPath>

            <clipPath id="bottle-clip">
              <rect x="703" y="1086" width="84" height="142" rx="10" />
            </clipPath>

          <span id="play-label">Pause</span>
        </button>
        <button id="btn-copy" type="button" class="ctrl-btn" title="Copier le code HTML5 autonome">

        </button>
        <button id="btn-download" type="button" class="ctrl-btn" title="Télécharger ce fichier index.html autonome">
          <span>Télécharger HTML5</span>
        </button>
        <button id="btn-zen" type="button" class="ctrl-btn ctrl-btn-accent" title="Masquer l'interface pour l'enregistrement vidéo (H ou Échap)">
          <span>Mode vidéo</span>
        </button>

    <script>
      (function () {
        var stage = document.getElementById('stage');
        var frame = document.getElementById('fb-frame');
        var controlsBar = document.getElementById('controls-bar');
        var btnTogglePlay = document.getElementById('btn-toggle-play');
        var playLabel = document.getElementById('play-label');
        var btnCopy = document.getElementById('btn-copy');
        var copyLabel = document.getElementById('copy-label');
        var btnDownload = document.getElementById('btn-download');
        var btnZen = document.getElementById('btn-zen');
        var btnRestore = document.getElementById('btn-restore');

        var isPaused = false;
        var isCleanMode = false;

        function setPaused(next) {
          isPaused = next;
          frame.classList.toggle('scene-paused', isPaused);
          playLabel.textContent = isPaused ? 'Lire' : 'Pause';
        }

        function setCleanMode(next) {
          isCleanMode = next;
          frame.classList.toggle('is-zen', isCleanMode);
          controlsBar.classList.toggle('hidden', isCleanMode);
          btnRestore.classList.toggle('visible', isCleanMode);
        }

        function buildCurrentHtml() {
          var clone = document.documentElement.cloneNode(true);
          var scripts = clone.querySelectorAll('script[src*="/@vite"], script[src*="@react-refresh"]');
          for (var i = 0; i < scripts.length; i++) {
            scripts[i].parentNode.removeChild(scripts[i]);
          }
          var clonedFrame = clone.querySelector('#fb-frame');
          var clonedControls = clone.querySelector('#controls-bar');
          var clonedRestore = clone.querySelector('#btn-restore');
          var clonedPlayLabel = clone.querySelector('#play-label');
          var clonedCopyLabel = clone.querySelector('#copy-label');
          if (clonedFrame) clonedFrame.className = 'fb-frame-4-5';
          if (clonedControls) clonedControls.className = 'controls-bar';
          if (clonedRestore) clonedRestore.className = 'restore-btn';
          if (clonedPlayLabel) clonedPlayLabel.textContent = 'Pause';
          if (clonedCopyLabel) clonedCopyLabel.textContent = 'Copier HTML5';
          return '<!doctype html>\n' + clone.outerHTML;
        }

        btnTogglePlay.addEventListener('click', function () {
          setPaused(!isPaused);
        });

        btnZen.addEventListener('click', function () {
          setCleanMode(true);
        });

        btnRestore.addEventListener('click', function () {
          setCleanMode(false);
        });

        stage.addEventListener('dblclick', function () {
          if (isCleanMode) {
            setCleanMode(false);
          }
        });

        btnCopy.addEventListener('click', function () {
          var html = buildCurrentHtml();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(html).then(showCopiedFeedback, fallbackCopy);
          } else {
            fallbackCopy();
          }

          function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = html;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopiedFeedback();
          }

          function showCopiedFeedback() {
            copyLabel.textContent = 'Copié';
            window.setTimeout(function () {
              copyLabel.textContent = 'Copier HTML5';
            }, 2200);
          }
        });

        btnDownload.addEventListener('click', function () {
          var blob = new Blob([buildCurrentHtml()], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'eco2nature-animation-plancton.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        });

        window.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && isCleanMode) {
            setCleanMode(false);
          } else if (event.key && event.key.toLowerCase() === 'h') {
            setCleanMode(!isCleanMode);
          } else if (event.key === ' ') {
            event.preventDefault();
            setPaused(!isPaused);
          }
        });
      })();
    </script>
